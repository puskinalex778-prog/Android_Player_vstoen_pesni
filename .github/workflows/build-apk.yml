name: Build E-Televizor Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compile Android TV & Phone APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Release APKs
        run: gradle assembleRelease --stacktrace

      - name: Prepare renamed APKs
        run: |
          mkdir -p dist
          for apk in app/build/outputs/apk/release/*.apk; do
            base=$(basename "$apk")
            if [[ "$base" == *"universal"* ]]; then
              cp "$apk" "dist/E-Televizor-universal.apk"
            elif [[ "$base" == *"arm64-v8a"* ]]; then
              cp "$apk" "dist/E-Televizor-arm64-v8a.apk"
            elif [[ "$base" == *"armeabi-v7a"* ]]; then
              cp "$apk" "dist/E-Televizor-armeabi-v7a.apk"
            elif [[ "$base" == *"x86_64"* ]]; then
              cp "$apk" "dist/E-Televizor-x86_64.apk"
            fi
          done
          ls -lh dist/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: E-Televizor-APKs
          path: dist/*.apk
          retention-days: 30

      - name: Publish GitHub Release with APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0-latest
          name: "Е-Телевизёр v1.1.0 — IPTV плеер для Android TV и телефонов"
          body: |
            ### Е-Телевизёр v1.1.0 — IPTV плеер для Android TV и смартфонов

            **Новое в v1.1.0:**
            - **Перемотка назад/вперёд (`⏪ -10с` / `⏩ +10с`, настраиваемый шаг `5–60с`)** прямо в плеере — работает в **Архиве**, **VOD** и в **прямом эфире (Таймшифт)** + кнопка `● В эфир` для мгновенного возврата.
            - **Обновлённая панель EPG и Архива**: две отдельные вкладки **«Прямой эфир»** и **«↺ Архив»**, цветовая маркировка передач (зелёный = в эфире, оранжевый = архив, серый = будущие), а также глобальные настройки типа и глубины архива.
            - **Глобальное изменение размера текста (`85% – 170%`)** и **выбор чёткого читаемого ТВ-шрифта** (действует на все меню, каналы, телепрограмму и OSD плеера для комфортного чтения с расстояния).
            - **Поиск бесплатных открытых плейлистов (РФ и Зарубежные)** прямо внутри приложения + готовые пресеты бесплатных EPG (`.xml.gz`) и загрузка EPG из памяти устройства.
            - **Универсальный парсер плейлистов**: `.m3u`, `.m3u8`, `.m3u.gz`, `.xspf`, `.pls`, `.txt`, автоопределение кодировки UTF-8 / Windows-1251, заголовки `|User-Agent=...&Referer=...`, `#EXTHTTP` и кнопка **«📋 Вставить из буфера»**.
            - **Пресет пульта «Как в Televizo»** + настройки «Скрывать ссылки плейлистов», «Загружать EPG из плейлиста», «Показывать группу Все каналы».

            **Какой APK скачать:**
            - `E-Televizor-arm64-v8a.apk` — для современных смартфонов и 64-битных ТВ-приставок.
            - `E-Televizor-armeabi-v7a.apk` — для 32-битных Android TV и бюджетных ТВ-приставок (Mi Box, старые ТВ).
            - `E-Televizor-universal.apk` — универсальный APK для любых устройств Android.
          files: dist/*.apk
          make_latest: true
          overwrite_files: true
