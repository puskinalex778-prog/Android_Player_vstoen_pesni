name: Build E-Televizor Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compile Android TV & Phone APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Release APKs
        run: gradle assembleRelease --stacktrace

      - name: Prepare renamed APKs
        run: |
          mkdir -p dist
          for apk in app/build/outputs/apk/release/*.apk; do
            base=$(basename "$apk")
            if [[ "$base" == *"universal"* ]]; then
              cp "$apk" "dist/E-Televizor-universal.apk"
            elif [[ "$base" == *"arm64-v8a"* ]]; then
              cp "$apk" "dist/E-Televizor-arm64-v8a.apk"
            elif [[ "$base" == *"armeabi-v7a"* ]]; then
              cp "$apk" "dist/E-Televizor-armeabi-v7a.apk"
            elif [[ "$base" == *"x86_64"* ]]; then
              cp "$apk" "dist/E-Televizor-x86_64.apk"
            fi
          done
          ls -lh dist/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: E-Televizor-APKs
          path: dist/*.apk
          retention-days: 30

      - name: Publish GitHub Release with APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0-latest
          name: "Е-Телевизёр v1.2.0 — IPTV плеер для Android TV и телефонов"
          body: |
            ### Е-Телевизёр v1.2.0 — IPTV плеер для Android TV и смартфонов

            **Новое в v1.2.0:**
            - **Исправлен интерфейс кнопок и текста на телефонах и ТВ**: убрана заливка Material3, скрывавшая текст на кнопках, все кнопки и заголовки теперь адаптивной высоты (`wrap_content`) — текст больше не обрезается даже на узких экранах и при увеличенном шрифте! Заголовок EPG (`Вчера / Сегодня / Завтра`) перенесён в удобную двухстрочную шапку.
            - **Встроенный самообновляемый IPTV плейлист сразу при запуске**: при первом открытии автоматически подключается самообновляемый плейлист (ТВ РФ + Мир + EPG, обновление каждые 12ч) — можно смотреть каналы сразу без ручной настройки.
            - **Живой парсер и поиск бесплатных M3U / M3U8 по источникам**: встроенный сканер сайтов и GitHub-репозиториев (`https://m3u.su/`, `slava-67/TV`, `iptv-org`, а также любой ваш URL) с поиском по РФ и зарубежным каналам в 1 клик.
            - **Архив, перемотка `±10с` (в архиве, VOD и прямом эфире/таймшифт)**, глобальный размер текста (`85%–170%`), выбор чёткого ТВ-шрифта и все 8 разделов настроек.

            **Какой APK скачать:**
            - `E-Televizor-arm64-v8a.apk` — для современных смартфонов и 64-битных ТВ-приставок.
            - `E-Televizor-armeabi-v7a.apk` — для 32-битных Android TV и бюджетных ТВ-приставок (Mi Box, старые ТВ).
            - `E-Televizor-universal.apk` — универсальный APK для любых устройств Android.
          files: dist/*.apk
          make_latest: true
          overwrite_files: true
