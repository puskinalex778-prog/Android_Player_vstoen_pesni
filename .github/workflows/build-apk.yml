name: Build E-Televizor Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compile Android TV & Phone APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Release APKs
        run: gradle assembleRelease --stacktrace

      - name: Prepare renamed APKs
        run: |
          mkdir -p dist
          for apk in app/build/outputs/apk/release/*.apk; do
            base=$(basename "$apk")
            if [[ "$base" == *"universal"* ]]; then
              cp "$apk" "dist/E-Televizor-universal.apk"
            elif [[ "$base" == *"arm64-v8a"* ]]; then
              cp "$apk" "dist/E-Televizor-arm64-v8a.apk"
            elif [[ "$base" == *"armeabi-v7a"* ]]; then
              cp "$apk" "dist/E-Televizor-armeabi-v7a.apk"
            elif [[ "$base" == *"x86_64"* ]]; then
              cp "$apk" "dist/E-Televizor-x86_64.apk"
            fi
          done
          ls -lh dist/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: E-Televizor-APKs
          path: dist/*.apk
          retention-days: 30

      - name: Publish GitHub Release with APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0-latest
          name: "Е-Телевизёр v1.3.0 — EPG от Gabbarit + расширенный каталог бесплатных плейлистов"
          body: |
            ### Е-Телевизёр v1.3.0 — IPTV плеер для Android TV и смартфонов

            **Новое в v1.3.0:**
            - **Телепрограмма от Gabbarit (Габарит)** в 1 клик (все проверенные рабочие версии):
              - `Gabbarit Light` (`http://gabbarit.drm-play.com/epg_lite.xml.gz` — 14.8 МБ, по умолчанию)
              - `Gabbarit Зеркало epg.one` (`http://gabbarit.epg.one/epg_1.xml.gz` — 26.6 МБ)
              - `Gabbarit Полная неделя + кинозалы` (`http://gabbarit.drm-play.com/epg_1.xml.gz` — 70 МБ)
              - `Gabbarit Архив 14 дней` (`http://gabbarit.drm-play.com/epg_14.xml.gz` — 154 МБ)
            - **Ещё 11 проверенных бесплатных источников EPG**: `IPTVX.one` (Lite / NoArch / Full), `Filmax TV`, `CineMan` (кинозалы), `ProgramTV.ru`, `Open-EPG`, `EPGshare01` (США, Великобритания, Германия, Весь мир).
            - **Расширенный каталог проверенных бесплатных самообновляемых плейлистов**: добавлены `Dimonovich FREE TV`, `NGRCH Россия`, `Free-TV Россия и Весь мир`, а также тематические сборки `slava-67` (`avto-full`, `avto`, `avtomini`, `kinofilm`, `kino-plus`, `sport`, `kids`, `poznavatelni`) и `iptv-org`.
            - Увеличен сетевой таймаут загрузки EPG до 90 секунд для стабильной загрузки больших архивов `.xml.gz` (включая полный Gabbarit).

            **Какой APK скачать:**
            - `E-Televizor-arm64-v8a.apk` — для современных смартфонов и 64-битных ТВ-приставок.
            - `E-Televizor-armeabi-v7a.apk` — для 32-битных Android TV и бюджетных ТВ-приставок (Mi Box, старые ТВ).
            - `E-Televizor-universal.apk` — универсальный APK для любых устройств Android.
          files: dist/*.apk
          make_latest: true
          overwrite_files: true
